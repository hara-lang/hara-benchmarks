name: Canonical benchmark evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmarks.yml'
      - 'adapters/**'
      - 'config/**'
      - 'hara_bench/**'
      - 'schema/**'
      - 'scripts/publish_results.py'
      - 'suites/**'
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark tier
        type: choice
        options: [nightly, weekly, smoke]
        default: nightly
  schedule:
    - cron: '23 3 * * *'
    - cron: '41 4 * * 0'

permissions:
  actions: write
  contents: write

concurrency:
  group: benchmark-${{ github.event_name }}-${{ github.event.schedule || inputs.profile || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  canonical:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --cpus 4 --memory 7g
    env:
      HARA_ROOT: ${{ github.workspace }}/vendor/hara
      HARA_BENCH_ROOT: ${{ github.workspace }}
      HARA_BENCH_CONTAINER_IMAGE: ubuntu:24.04
      HARA_BENCH_CHEZ_EXECUTABLE: /usr/bin/chezscheme
      CLOJURE_DEPS: '{:mvn/repos {"central" {:url "https://repo.maven.apache.org/maven2/"}} :deps {org.clojure/clojure {:mvn/version "1.12.5"}}}'
    steps:
      - name: Install runner dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git gzip tar time python3 python3-pip \
            openjdk-21-jdk-headless sbcl chezscheme guile-3.0 luajit pypy3
          /usr/bin/chezscheme --version
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          path: vendor/hara
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
      - uses: dtolnay/rust-toolchain@stable
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
      - name: Install pinned Clojure CLI
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 \
            --output /tmp/linux-install-clojure.sh \
            https://download.clojure.org/install/linux-install-1.12.5.1664.sh
          chmod +x /tmp/linux-install-clojure.sh
          /tmp/linux-install-clojure.sh --prefix /usr/local
          clojure -Sdescribe
      - name: Resolve Java toolchain
        shell: bash
        run: |
          javac_path=$(readlink -f "$(command -v javac)")
          java_home=$(dirname "$(dirname "$javac_path")")
          test -x "$java_home/bin/javac"
          test -x "$java_home/bin/java"
          echo "HARA_BENCH_JAVA_HOME=$java_home" >> "$GITHUB_ENV"
      - name: Prime pinned Clojure dependencies
        working-directory: suites/language
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if clojure -Sdeps "$CLOJURE_DEPS" -P; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Select profile and runtime scope
        id: profile
        shell: bash
        run: |
          value="${{ inputs.profile }}"
          runtime_args=""
          if [ "${{ github.event_name }}" = "push" ]; then
            value=smoke
            runtime_args="--runtime hara-rust-whole-wasm-prepared --runtime luajit-prepared --runtime pypy-prepared --runtime node-prepared --runtime ruby-yjit-prepared --runtime clojure-prepared --runtime sbcl-prepared --runtime chez-prepared --runtime guile-prepared --runtime bb-prepared --runtime python-prepared --runtime c-prepared --runtime java-prepared"
          elif [ -z "$value" ]; then
            if [ "${{ github.event.schedule }}" = "41 4 * * 0" ]; then value=weekly; else value=nightly; fi
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "runtime_args=$runtime_args" >> "$GITHUB_OUTPUT"
      - name: Record immutable revisions
        shell: bash
        run: |
          echo "HARA_BENCHMARK_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "HARA_REVISION=$(git -C "$HARA_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run algorithm corpus
        env:
          RUNTIME_ARGS: ${{ steps.profile.outputs.runtime_args }}
        run: |
          python3 -m hara_bench run \
            --suite algorithms \
            --profile "${{ steps.profile.outputs.value }}" \
            --hara-root "$HARA_ROOT" \
            $RUNTIME_ARGS
      - name: Verify comparison runtime coverage
        run: >-
          python3 scripts/verify_language_coverage.py results/local/language.json
          --runtime hara-rust-whole-wasm-prepared --runtime luajit-prepared
          --runtime pypy-prepared --runtime node-prepared
          --runtime ruby-yjit-prepared --runtime clojure-prepared
          --runtime sbcl-prepared --runtime chez-prepared --runtime guile-prepared
          --runtime bb-prepared --runtime python-prepared --runtime c-prepared
          --runtime java-prepared --minimum 6
      - name: Normalize evidence
        if: always()
        run: test ! -f results/local/language.json || python3 -m hara_bench import-language results/local/language.json results/local/normalized.json
      - name: Validate normalized evidence
        if: always()
        run: test ! -f results/local/normalized.json || python3 -m hara_bench validate results/local/normalized.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-linux-x86_64-${{ steps.profile.outputs.value }}
          path: results/local/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: canonical
    if: needs.canonical.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: artifacts
      - name: Prepare benchmark history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir history
          git -C history init
          git -C history remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C history fetch --depth=1 origin benchmarks-data; then
            git -C history checkout -B benchmarks-data FETCH_HEAD
          else
            git -C history checkout --orphan benchmarks-data
          fi
      - name: Promote validated evidence
        run: PYTHONPATH=source python3 source/scripts/publish_results.py --inputs artifacts --output history
      - name: Commit benchmark history
        id: history
        shell: bash
        run: |
          git -C history config user.name github-actions[bot]
          git -C history config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C history add runs manifest.json
          if git -C history diff --cached --quiet; then
            echo "Benchmark evidence already published"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C history commit -m "publish benchmark run ${{ github.run_id }}"
          git -C history push origin HEAD:benchmarks-data
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild dashboard from published evidence
        if: steps.history.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main'
            })
