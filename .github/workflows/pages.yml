name: Publish benchmark dashboard

on:
  push:
    branches: [main, benchmarks-data]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add benchmark history when available
        run: |
          git fetch origin benchmarks-data:refs/remotes/origin/benchmarks-data || exit 0
          mkdir -p data/history
          git archive origin/benchmarks-data runs | tar -x -C data/history
      - run: python -m hara_bench build-site --data data --output dist
      - name: Set canonical public URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dist/index.html")
          content = path.read_text(encoding="utf-8")
          previous = "https://benchmarks.hara-lang.org/"
          canonical = "https://www.hara-lang.org/benchmarks/"
          if previous not in content:
              raise SystemExit("dashboard template no longer contains the expected previous public URL")
          path.write_text(content.replace(previous, canonical), encoding="utf-8")
          PY
      - name: Verify published comparison data
        run: python scripts/verify_dashboard_data.py dist/data/runs.json
      - name: Publish embeddable www bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf published
          mkdir published
          git -C published init
          git -C published remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C published fetch --depth=1 origin benchmark-site; then
            git -C published checkout -B benchmark-site FETCH_HEAD
          else
            git -C published checkout --orphan benchmark-site
          fi
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. published/
          rm -f published/CNAME
          printf '%s\n' "$GITHUB_SHA" > published/.source-revision
          git -C published config user.name github-actions[bot]
          git -C published config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C published add -A
          if git -C published diff --cached --quiet; then
            echo "Embeddable benchmark site already current"
          else
            git -C published commit -m "publish benchmark site ${GITHUB_RUN_ID}"
            git -C published push origin HEAD:benchmark-site
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
