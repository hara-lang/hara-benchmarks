name: Benchmark smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOJURE_DEPS: '{:mvn/repos {"central" {:url "https://repo.maven.apache.org/maven2/"}} :deps {org.clojure/clojure {:mvn/version "1.12.5"}}}'
      HARA_BENCH_CHEZ_EXECUTABLE: /usr/bin/chezscheme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          path: vendor/hara
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.5.1664
      - name: Install Chez Scheme
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chezscheme
          /usr/bin/chezscheme --version
      - name: Prime pinned Clojure dependencies
        working-directory: suites/language
        run: clojure -Sdeps "$CLOJURE_DEPS" -P
      - run: python -m unittest discover -v
      - run: node --check site/app.js
      - run: node --check suites/language/node_runner.mjs
      - run: ruby --yjit -c suites/language/ruby_runner.rb
      - name: Run portable smoke corpus
        run: >-
          python -m hara_bench run --suite algorithms --profile smoke
          --runtime python-prepared --runtime c-prepared --runtime java-prepared
          --runtime chez-prepared --runtime clojure-prepared --runtime node-prepared
          --runtime ruby-yjit-prepared
      - name: Verify smoke runtime coverage
        run: >-
          python scripts/verify_language_coverage.py results/local/language.json
          --runtime python-prepared --runtime c-prepared --runtime java-prepared
          --runtime chez-prepared --runtime clojure-prepared --runtime node-prepared
          --runtime ruby-yjit-prepared --minimum 6
      - name: Normalize smoke evidence
        run: python -m hara_bench import-language results/local/language.json results/local/normalized.json
      - run: python -m hara_bench validate results/local/normalized.json
      - run: python -m hara_bench validate data
      - run: python -m hara_bench build-site
      - name: Verify dashboard assets
        run: test -s dist/index.html && test -s dist/data/runs.json && test -s dist/data/catalog.json
