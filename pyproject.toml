[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hara-benchmarks"
version = "0.1.0"
description = "Reproducible cross-runtime benchmarks for Hara"
requires-python = ">=3.11"

[project.scripts]
hara-bench = "hara_bench.cli:main"

[tool.setuptools.packages.find]
include = ["hara_bench*"]

